[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logo-generator"
version = "0.1.0"
description = "Programmatic logo and product-image generation CLI"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.8.0",
    "fal-client>=0.10.0",
    "openai>=2.41.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
logo-generate = "logo_generator.generate_logo:main"
logo-export = "logo_generator.export:main"

[tool.setuptools.packages.find]
where = ["src"]
