[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limner"
version = "0.1.0"
description = "Programmatic logo and product-image generation CLI"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.8.0,<3",
    # Ceilings sit at the next major above the versions run through the installed command on 2026-11-13
    # (openai 3.49.0, fal-client 1.0.3, google-genai 2.34.0), so a reinstall cannot pull an untested major.
    "fal-client>=0.10.0,<2",
    "openai>=2.41.0,<4",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
limner-generate = "limner.generate_logo:main"
limner-export = "limner.export:main"

[tool.setuptools.packages.find]
where = ["src"]
